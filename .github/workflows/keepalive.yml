name: support-keepalive

# A free Supabase project is paused after about a week without requests, and the support chat would silently stop.
# GitHub turns scheduled workflows off after 60 days without commits: if the chat goes quiet, look here first.
on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # The public anon key, the same one shipped in the app and the admin page.
      KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpZmtsbHh2enFhdWRteHV6Y2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MTU3NzMsImV4cCI6MjEwOTE5MTc3M30.pZVtbOeCoSDV0ZFp_nAEQ1WRuNDDpq0IKCaLeQtGFls
    steps:
      - name: Touch the API and the database
        run: |
          curl -fsS -o /dev/null -H "apikey: $KEY" https://xifkllxvzqaudmxuzcgb.supabase.co/auth/v1/health
          curl -fsS -o /dev/null -H "apikey: $KEY" -H "Authorization: Bearer $KEY" https://xifkllxvzqaudmxuzcgb.supabase.co/rest/v1/
