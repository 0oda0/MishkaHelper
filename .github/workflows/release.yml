name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      # Folders, not single-file: native speech/GPU libraries must sit where their loaders look for them.
      - name: Publish (full + Lite)
        shell: pwsh
        run: |
          dotnet publish src/MishkaHelper.csproj -c Release -r win-x64 --self-contained -p:Version=$env:APP_VERSION -o publish
          dotnet clean src/MishkaHelper.csproj -c Release -r win-x64
          dotnet publish src/MishkaHelper.csproj -c Release -r win-x64 --self-contained -p:Version=$env:APP_VERSION -p:Flavor=Lite -o publish-lite

      - name: Installers and portable zips
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $env:FLAVOR = "";     & $iscc installer\MishkaHelper.iss
          $env:FLAVOR = "Lite"; & $iscc installer\MishkaHelper.iss
          Get-ChildItem publish -Exclude *.pdb, *.xml | Compress-Archive -DestinationPath "dist\MishkaHelper-Portable-$env:APP_VERSION.zip"
          Get-ChildItem publish-lite -Exclude *.pdb, *.xml | Compress-Archive -DestinationPath "dist\MishkaHelper-Lite-Portable-$env:APP_VERSION.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MishkaHelper
          path: dist/*

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
