name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Unit tests
        run: dotnet test tests -c Release

      # Folders, not single-file: native speech/GPU libraries must sit where their loaders look for them.
      # One build with everything; the installer's checkboxes (and the settings page) choose the parts.
      - name: Publish
        shell: pwsh
        run: dotnet publish src/MishkaHelper.csproj -c Release -r win-x64 --self-contained -p:Version=$env:APP_VERSION -o publish

      - name: Installers and portable zips
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\MishkaHelper.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem publish -Exclude *.pdb, *.xml | Compress-Archive -DestinationPath "dist\MishkaHelper-Portable-$env:APP_VERSION.zip"
          # Copies under the old edition names: copies of 1.x look for exactly these. The installer keeps each edition's parts;
          # the portable zips carry the matching modules.ini.
          $parts = @{ Lite = "jarvis=0`r`nsecretary=0`r`ngames=0"; Secretary = "jarvis=0`r`nsecretary=1`r`ngames=0"; Jarvis = "jarvis=1`r`nsecretary=0`r`ngames=1" }
          foreach ($f in $parts.Keys) {
            Copy-Item "dist\MishkaHelper-Setup-$env:APP_VERSION.exe" "dist\MishkaHelper-$f-Setup-$env:APP_VERSION.exe"
            Remove-Item publish-old -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item publish publish-old -Recurse
            Set-Content publish-old\modules.ini $parts[$f] -NoNewline
            Get-ChildItem publish-old -Exclude *.pdb, *.xml | Compress-Archive -DestinationPath "dist\MishkaHelper-$f-Portable-$env:APP_VERSION.zip"
          }
          Get-ChildItem dist | Format-Table Name, Length

      # Android app: same version as the PC app, signed with the project key (repository secrets) so updates install over it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Phone app (APK)
        shell: pwsh
        env:
          MISHKA_KEYSTORE_PASSWORD: ${{ secrets.MISHKA_KEYSTORE_PASSWORD }}
        run: |
          # Without the project key an APK can't be updated later (each runner makes its own debug key) — skip, don't ship that.
          if (-not "${{ secrets.MISHKA_KEYSTORE_B64 }}") { Write-Warning "MISHKA_KEYSTORE_B64 secret missing: phone app not built"; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\mishka.keystore", [Convert]::FromBase64String("${{ secrets.MISHKA_KEYSTORE_B64 }}"))
          $env:MISHKA_KEYSTORE = "$env:RUNNER_TEMP\mishka.keystore"
          Push-Location mobile
          .\gradlew.bat assembleRelease --no-daemon --console=plain "-PappVersion=$env:APP_VERSION"
          Pop-Location
          Copy-Item mobile\app\build\outputs\apk\release\app-release.apk dist\Mishka-Phone.apk
          Get-Item dist\Mishka-Phone.apk | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MishkaHelper
          path: dist/*

      # What's new in this version, then which file is which: people get lost among eight downloads.
      - name: Release text
        shell: pwsh
        run: |
          $utf8 = New-Object Text.UTF8Encoding($false)
          $body = [IO.File]::ReadAllText("RELEASE_NOTES.md", $utf8).TrimEnd() + "`n`n" + [IO.File]::ReadAllText("docs/EDITIONS.md", $utf8)
          [IO.File]::WriteAllText("release-body.md", $body, $utf8)

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-body.md
